ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Каждый SSE-поток занимает один процесс prefork, поэтому это же и предел числа онлайн-пользователей.
<IfModule mpm_prefork_module>
    MaxRequestWorkers 150
</IfModule>

# unsafe-eval нужен полной сборке Vue 2 (компиляция шаблона из DOM).
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "no-referrer"

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
<Files "api.php">
    LimitRequestBody 16384
</Files>
